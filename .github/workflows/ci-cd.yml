name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# No pull_request trigger: SonarQube Community Build analyses main only.
# This alone does not stop fork PRs (a fork can add its own workflow). The runner Mac
# is protected by "Require approval for all external contributors": never approve fork runs.

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Upload coverage for the SonarQube job
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  sonar:
    name: SonarQube scan + quality gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for blame / new-code detection

      - name: Download coverage from the quality job
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage/

      - name: SonarQube scan (fails if the quality gate fails)
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  deploy:
    name: Deploy to GitHub Pages
    needs: [quality, sonar]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
